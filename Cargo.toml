[package]
name = "custom-ui"
version = "1.1.0"
edition = "2021"
description = "Custom Windows shell (Explorer replacement)"
license = "MIT"
repository = "https://github.com/sergey1029/custom-ui"

[build-dependencies]
embed-resource = "2.5"

[[bin]]
name = "custom-ui"
path = "src/main.rs"

[[bin]]
name = "custom-ui-settings"
path = "src/settings/main.rs"

# The installer embeds the two release exes, so it is built after them (see build.ps1).
[[bin]]
name = "custom-ui-setup"
path = "src/setup/main.rs"
required-features = ["installer"]

[features]
installer = []

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Data_Json",
    "Data_Xml_Dom",
    "Devices_Radios",
    "Foundation_Collections",
    "Networking_Connectivity",
    "Storage",
    "Storage_Search",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
